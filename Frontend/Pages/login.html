<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Dashboard - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/login.js" defer></script>
</head>
<body>

    <div class="login-container">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
                    
                    <div class="card login-card p-4 p-sm-5 animate-fade-in-up">
                        
                        <div class="text-center mb-4 animate-delay-1">
                            <div class="brand-icon-wrapper mb-3">
                                <i class="bi bi-shield-lock-fill text-info fs-2"></i>
                            </div>
                            <h2 class="fw-bold text-white m-0">Enterprise Portal</h2>
                            <p class="text-muted small mt-2">Secure Management Dashboard Access</p>
                        </div>

                        <form id="loginForm">
                            
                            <div class="mb-4 animate-delay-2">
                                <label for="username" class="form-label text-light small fw-semibold">Username</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-dark-subtle border-secondary text-secondary">
                                        <i class="bi bi-person-fill"></i>
                                    </span>
                                    <input type="text" class="form-control" id="username" placeholder="Enter your username" required>
                                </div>
                            </div>

                            <div class="mb-4 animate-delay-3">
                                <label for="password" class="form-label text-light small fw-semibold">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-dark-subtle border-secondary text-secondary">
                                        <i class="bi bi-lock-fill"></i>
                                    </span>
                                    <input type="password" class="form-control" id="password" placeholder="••••••••" required>
                                </div>
                            </div>

                            <div class="mb-4 animate-delay-4">
                                <label for="userRole" class="form-label text-light small fw-semibold">Select Role</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-dark-subtle border-secondary text-secondary">
                                        <i class="bi bi-person-badge-fill"></i>
                                    </span>
                                    <select class="form-select" id="userRole" required>
                                        <option value="" disabled selected>Choose your role...</option>
                                        <option value="GENERAL_USER">General User</option>
                                        <option value="ADMIN">Admin</option>
                                    </select>
                                </div>
                            </div>

                            <div class="d-flex justify-content-between align-items-center mb-4 animate-delay-5">
                                <!-- <div class="form-check">
                                    <input type="checkbox" class="form-check-input" id="rememberMe">
                                    <label class="form-check-label text-muted small user-select-none" for="rememberMe">Remember me</label>
                                </div>
                                <a href="#" class="text-info small text-decoration-none hover-underline">Forgot Password?</a> -->
                            </div>

                            <div class="animate-delay-6">
                                <button type="submit" id="submitBtn" class="btn btn-info w-100 fw-bold py-2 text-uppercase tracking-wider">
                                    <span id="btnText">Sign In</span>
                                    <div id="btnSpinner" class="spinner-border spinner-border-sm text-dark d-none" role="status">
                                        <span class="visually-hidden">Loading...</span>
                                    </div>
                                </button>
                            </div>

                            <div id="errorMessage" class="error-banner d-none mt-3 p-3 text-center small rounded">
                                <i class="bi bi-exclamation-triangle-fill me-2"></i> Invalid Username or Password
                            </div>

                        </form>
                        
                    </div> 
                </div>
            </div>
        </div>
    </div>
</body>
</html>
